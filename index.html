<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="الموقع الرسمي للبروفيسور براهيم بن داود – بروفيسور في القانون العام، محامٍ معتمد لدى المحكمة العليا ومجلس الدولة، ومدير الدراسات العليا جامعة الغرير بدبي سابقاً" />
  <meta name="author" content="البروفيسور براهيم بن داود" />
  <meta name="robots" content="index, follow" />

  <title>براهيم بن داود | الموقع الرسمي</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")</script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Amiri', 'serif'],
            arabic: ['Tajawal', 'sans-serif'],
            latin: ['Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              600: '#475569',
              500: '#64748b',
              400: '#94a3b8',
              300: '#cbd5e1',
              200: '#e2e8f0',
            },
            amber: {
              500: '#d97706',
              600: '#b45309',
              400: '#f59e0b',
              300: '#fbbf24',
            },
          },
        },
      },
    };
  </script>

  <!-- Font Awesome 6 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <div id="topbar"></div>
  <nav id="navbar" class="fixed top-9 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-gray-800">
  </nav>

  <!-- Hero Section -->
  <section id="hero" class="section-fade relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-b from-amber-500/5 to-transparent pointer-events-none"></div>
    <div class="absolute top-20 left-10 w-72 h-72 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>
  </section>

  <!-- Vision Section -->
  <section id="vision" class="section-fade">
  </section>

  <!-- Timeline Section -->
  <section id="timeline" class="section-fade">
  </section>

  <!-- Certificates Section -->
  <section id="certificates" class="section-fade">
  </section>

  <!-- Footer -->
  <footer id="footer" class="border-t border-gray-800">
  </footer>

  <!-- Main Application Module -->
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
