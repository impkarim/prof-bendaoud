<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة التحكم | براهيم بن داود</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { title: ['Amiri', 'serif'], arabic: ['Tajawal', 'sans-serif'], latin: ['Inter', 'sans-serif'] },
          colors: {
            slate: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569', 500: '#64748b', 400: '#94a3b8', 300: '#cbd5e1', 200: '#e2e8f0' },
            amber: { 500: '#d97706', 600: '#b45309', 400: '#f59e0b', 300: '#fbbf24' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <span class="text-xl font-bold text-white tracking-tight font-title">لوحة التحكم</span>
        <button id="logout-btn" class="hidden text-sm border border-gray-600 text-gray-300 hover:border-amber-500 hover:text-amber-400 rounded-lg px-4 py-2 transition-colors">
          <i class="fas fa-sign-out-alt me-1"></i>خروج
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="login-view">
      <div class="max-w-sm mx-auto">
        <div class="text-center mb-8">
          <div class="w-16 h-16 mx-auto rounded-full bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl mb-4">
            <i class="fas fa-user-lock"></i>
          </div>
          <h1 class="text-2xl font-bold text-white font-title">تسجيل الدخول</h1>
          <p class="text-gray-400 text-sm mt-2">الوصول مخصص للإدارة فقط</p>
        </div>
        <form id="login-form" class="space-y-4 bg-white/[0.02] border border-gray-700/30 rounded-2xl p-6">
          <div>
            <label class="block text-gray-300 text-sm font-bold mb-2">كلمة المرور</label>
            <input id="admin-password" type="password" required class="w-full bg-slate-800/70 border border-gray-600 rounded-xl px-4 py-3 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-amber-500 transition-colors" placeholder="أدخل كلمة المرور">
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl px-6 py-3 text-sm font-bold transition-all duration-300 shadow-lg shadow-amber-500/20">
            <i class="fas fa-sign-in-alt me-1"></i>دخول
          </button>
        </form>
      </div>
    </div>

    <div id="dashboard-view" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-8">
        <div class="bg-white/[0.02] border border-gray-700/30 rounded-2xl p-5">
          <h2 class="text-white font-bold text-lg font-title mb-3 flex items-center gap-2">
            <i class="fas fa-pause-circle text-amber-400"></i>حالة الحجوزات
          </h2>
          <div class="flex items-center justify-between">
            <span id="pause-status" class="text-gray-300 text-sm">نشطة</span>
            <button id="pause-btn" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors bg-emerald-600 text-white">إيقاف مؤقت</button>
          </div>
        </div>
        <div class="bg-white/[0.02] border border-gray-700/30 rounded-2xl p-5">
          <h2 class="text-white font-bold text-lg font-title mb-3 flex items-center gap-2">
            <i class="fas fa-clock text-amber-400"></i>ساعات العمل
          </h2>
          <p class="text-gray-300 text-sm mb-3" id="slots-summary">...جاري التحميل</p>
          <button id="edit-slots-btn" class="px-4 py-2 rounded-lg text-sm font-bold border border-gray-600 text-gray-300 hover:border-amber-500 hover:text-amber-400 transition-colors">تعديل الأوقات</button>
        </div>
        <div class="bg-white/[0.02] border border-gray-700/30 rounded-2xl p-5">
          <h2 class="text-white font-bold text-lg font-title mb-3 flex items-center gap-2">
            <i class="fas fa-calendar-check text-amber-400"></i>الإحصائيات
          </h2>
          <p class="text-3xl font-bold text-amber-400" id="booking-count">0</p>
          <p class="text-gray-400 text-xs mt-1">حجزاً إجمالياً</p>
        </div>
      </div>

      <div class="bg-white/[0.02] border border-gray-700/30 rounded-2xl overflow-hidden mb-6">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-700/30">
          <h2 class="text-white font-bold text-lg font-title">الحجوزات</h2>
          <button id="refresh-btn" class="text-sm text-gray-400 hover:text-amber-400 transition-colors"><i class="fas fa-sync-alt me-1"></i>تحديث</button>
        </div>
        <div id="bookings-list" class="divide-y divide-gray-700/30">
          <div class="p-5 text-center text-gray-400 text-sm">جاري تحميل الحجوزات...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="slots-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
    <div class="bg-slate-900 border border-gray-700 rounded-2xl p-6 max-w-lg w-full max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-white font-bold text-lg font-title">تعديل ساعات العمل</h3>
        <button id="close-slots-modal" class="text-gray-400 hover:text-amber-400 text-xl"><i class="fas fa-times"></i></button>
      </div>
      <div class="mb-4">
        <label class="block text-gray-300 text-sm font-bold mb-2">أيام العمل</label>
        <div class="flex flex-wrap gap-2" id="days-grid"></div>
      </div>
      <div class="mb-5">
        <label class="block text-gray-300 text-sm font-bold mb-2">الأوقات المتاحة</label>
        <p class="text-gray-500 text-xs mb-2">ألغِ تحديد أي وقت لإخفائه (الوقت غير المحدد لن يظهر للزوار)</p>
        <div class="grid grid-cols-4 gap-2" id="slots-grid"></div>
      </div>
      <div class="flex gap-3">
        <button id="save-slots-btn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 text-white rounded-xl px-6 py-3 text-sm font-bold">حفظ</button>
        <button id="cancel-slots-btn" class="flex-1 border border-gray-600 text-gray-300 rounded-xl px-6 py-3 text-sm font-bold">إلغاء</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
