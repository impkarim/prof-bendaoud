<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="404 - الصفحة غير موجودة" />
  <meta name="robots" content="noindex, follow" />
  <title>404 | بن داود براهيم</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")</script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Amiri', 'serif'],
            arabic: ['Tajawal', 'sans-serif'],
            latin: ['Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              900: '#0f172a', 800: '#1e293b', 700: '#334155',
              600: '#475569', 500: '#64748b', 400: '#94a3b8',
              300: '#cbd5e1', 200: '#e2e8f0',
            },
            amber: { 500: '#d97706', 600: '#b45309', 400: '#f59e0b', 300: '#fbbf24' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    [data-theme="light"] body { background-color: #f8f6f3; }
    body { background-color: #0f172a; }
  </style>
</head>
<body>
  <div class="text-center max-w-lg mx-auto px-4">
    <!-- 404 number -->
    <div class="font-title text-[8rem] md:text-[10rem] leading-none font-bold text-amber-500/20 select-none">404</div>

    <!-- Page not found icon -->
    <div class="text-6xl text-amber-500/40 -mt-10 mb-6">
      <i class="fa-regular fa-compass"></i>
    </div>

    <!-- Arabic message -->
    <h1 class="font-arabic text-2xl md:text-3xl font-bold text-white mb-3" lang="ar">
      الصفحة غير موجودة
    </h1>
    <p class="font-arabic text-gray-400 text-base md:text-lg mb-8 leading-relaxed" lang="ar">
      يبدو أن الصفحة التي تبحث عنها قد انتقلت أو لم تعد موجودة.
    </p>

    <!-- English message -->
    <div class="border-t border-gray-800 pt-6 mt-6" lang="en">
      <h1 class="font-latin text-xl md:text-2xl font-semibold text-gray-300 mb-3">
        Page Not Found
      </h1>
      <p class="font-latin text-gray-500 text-sm md:text-base mb-8 leading-relaxed">
        The page you&rsquo;re looking for has moved or doesn&rsquo;t exist.
      </p>
    </div>

    <!-- Home link -->
    <a href="./" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white font-arabic font-medium px-8 py-3 rounded-lg transition-all duration-300 hover:shadow-lg hover:shadow-amber-500/20">
      <i class="fa-solid fa-house"></i>
      <span ar-key="back_home">العودة إلى الرئيسية</span>
    </a>
  </div>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</body>
</html>
