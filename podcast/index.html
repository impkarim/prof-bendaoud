<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <title>البودكاست | براهيم بن داود</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Amiri', 'serif'],
            arabic: ['Tajawal', 'sans-serif'],
            latin: ['Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              900: '#0f172a', 800: '#1e293b', 700: '#334155',
              600: '#475569', 500: '#64748b', 400: '#94a3b8',

        },
      },
    };

        <div class="flex items-center gap-3 mb-8">

          </div>
          <div class="text-center pt-6">
            <div class="relative inline-block">
              <h1 id="page-heading" class="text-4xl lg:text-5xl font-bold text-white font-title leading-tight">البودكاست</h1>

                  <span id="page-badge" class="text-[11px] font-bold text-amber-400/70 tracking-wider">قناة يوتيوب</span>
