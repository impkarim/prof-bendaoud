<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="الملتقيات الوطنية والدولية – البروفيسور براهيم بن داود" />
  <title>الملتقيات | براهيم بن داود</title>
  <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Amiri', 'serif'],
            arabic: ['Tajawal', 'sans-serif'],
            latin: ['Inter', 'sans-serif'],
          },
          colors: {
            slate: {
              950: '#020617', 900: '#0f172a', 850: '#111827',
              800: '#1e293b', 750: '#1f2937', 700: '#334155',
              600: '#475569', 500: '#64748b', 400: '#94a3b8',
              300: '#cbd5e1', 200: '#e2e8f0',
            },
            amber: { 500: '#d97706', 600: '#b45309', 400: '#f59e0b', 300: '#fbbf24' },
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .year-divider { position: relative; }
    .timeline-line { position: absolute; right: 23px; top: 48px; bottom: 0; width: 1px; background: linear-gradient(to bottom, rgba(217,119,6,0.4), rgba(217,119,6,0.05)); }
    .timeline-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #d97706; background: #0f172a; position: absolute; right: 18px; top: 6px; z-index: 2; transition: all 0.3s ease; }
    .conf-card:hover .timeline-dot { background: #d97706; box-shadow: 0 0 12px rgba(217,119,6,0.4); }
    .conf-card { transition: all 0.3s ease; }
    .conf-card:hover { border-color: rgba(217,119,6,0.3) !important; }
    .tab-btn { cursor: pointer; }
    /* Hide scroll direction on hover zoom is fine */
  </style>
</head>
<body>

  <div id="topbar"></div>
  <nav id="navbar" class="fixed top-9 left-0 right-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-gray-800">
  </nav>

  <main id="conferences-page" class="pt-[100px] lg:pt-[116px]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16">
      <div class="flex items-center gap-3 mb-8">
        <a id="back-link" href="../index.html" class="text-gray-400 hover:text-amber-400 transition-colors text-sm">
          <i class="fas fa-arrow-right ml-1"></i>
          <span id="back-label" class="font-arabic">العودة للصفحة الرئيسية</span>
        </a>
      </div>

      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium tracking-wider uppercase mb-4">
          <i class="fas fa-microphone-alt"></i>
          <span id="page-badge">المشاركات العلمية</span>
        </div>
        <h1 id="page-heading" class="text-4xl lg:text-6xl font-bold text-white font-title leading-tight">الملتقيات الوطنية والدولية</h1>
        <div class="mt-4 flex items-center justify-center gap-3">
          <span class="h-px w-12 bg-amber-500/40"></span>
          <span class="text-amber-400/60 text-sm font-arabic" id="page-subtitle">مسيرة حافلة بالعطاء العلمي والبحثي</span>
          <span class="h-px w-12 bg-amber-500/40"></span>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-10 border border-gray-700/30 rounded-2xl p-2">
        <div class="flex gap-1 w-full sm:w-auto">
          <button id="btn-national" class="tab-btn active flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 bg-amber-500/20 text-amber-400 border border-amber-500/25 shadow-sm shadow-amber-500/5">الملتقيات الوطنية</button>
          <button id="btn-international" class="tab-btn flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-gray-400 border border-transparent hover:text-gray-200 hover:bg-white/5">الملتقيات الدولية</button>
        </div>
        <div id="stats-bar" class="flex items-center gap-4 text-xs text-gray-500 px-3">
          <span><span id="count-display" class="text-amber-400 font-bold text-base tabular-nums">0</span> <span id="count-label">ملتقى</span></span>
        </div>
      </div>

      <div id="conferences-list">
      </div>
    </div>
  </main>

  <footer id="footer" class="border-t border-gray-800">
  </footer>

  <script type="module" src="../assets/js/pages/conferences.js"></script>
</body>
</html>
